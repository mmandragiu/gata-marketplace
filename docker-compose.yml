# Demo mode (default):      docker compose up --build        →  http://localhost:3000
# Supabase mode / OpenAI:   put the variables in .env (see .env.example), then run the same command.
services:
  app:
    build: .
    image: gata-marketplace:latest
    ports:
      - "3000:3000"
    environment:
      DATA_MODE: ${DATA_MODE:-demo}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:-change-me-to-a-long-random-string}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    restart: unless-stopped
